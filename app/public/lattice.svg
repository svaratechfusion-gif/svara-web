<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glassBlur"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="strutGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0066cc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0066cc" stop-opacity="0.02"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef7"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </radialGradient>
  </defs>

  <!-- Struts (10 edges of K5) -->
  <g id="struts" stroke="url(#strutGrad)" stroke-width="1.5" fill="none">
    <path d="M200,80 L200,320"/>        <!-- OBSERVE → IMPROVE -->
    <path d="M200,80 L80,280"/>         <!-- OBSERVE → UNDERSTAND -->
    <path d="M200,80 L320,280"/>        <!-- OBSERVE → PREDICT -->
    <path d="M200,80 L200,420"/>        <!-- OBSERVE → COORDINATE -->
    <path d="M80,280 L320,280"/>        <!-- UNDERSTAND → PREDICT -->
    <path d="M80,280 L200,420"/>        <!-- UNDERSTAND → COORDINATE -->
    <path d="M320,280 L200,420"/>       <!-- PREDICT → COORDINATE -->
    <path d="M80,280 L200,220"/>        <!-- UNDERSTAND → IMPROVE -->
    <path d="M320,280 L200,220"/>       <!-- PREDICT → IMPROVE -->
    <path d="M200,420 L200,220"/>       <!-- COORDINATE → IMPROVE -->
  </g>

  <!-- Nodes -->
  <g id="nodes">
    <circle cx="200" cy="80" r="35" fill="url(#nodeGrad)" filter="url(#glassBlur)"/>
    <circle cx="80" cy="280" r="35" fill="url(#nodeGrad)" filter="url(#glassBlur)"/>
    <circle cx="320" cy="280" r="35" fill="url(#nodeGrad)" filter="url(#glassBlur)"/>
    <circle cx="200" cy="420" r="35" fill="url(#nodeGrad)" filter="url(#glassBlur)"/>
    <polygon points="200,220 170,280 230,280" fill="url(#centerGrad)"/> <!-- IMPROVE (dodecahedron ≈ triangle) -->
  </g>

  <!-- Labels -->
  <g font-family="var(--font-mono)" font-size="10" fill="#0a0a0a" text-anchor="middle">
    <text x="200" y="50">OBSERVE</text>
    <text x="80" y="330">UNDERSTAND</text>
    <text x="320" y="330">PREDICT</text>
    <text x="200" y="470">COORDINATE</text>
    <text x="200" y="200">IMPROVE</text>
  </g>

  <!-- Telemetry -->
  <g font-family="var(--font-mono)" font-size="9" fill="#666" text-anchor="middle">
    <text x="200" y="70">47 conn</text>
    <text x="80" y="260">12 models</text>
    <text x="320" y="260">8 horizons</text>
    <text x="200" y="450">6 actions</text>
    <text x="200" y="200">3 loops</text>
  </g>

  <!-- Center badge -->
  <g font-family="var(--font-mono)" font-size="9" fill="#666" text-anchor="middle" transform="translate(200, 200)">
    <text x="0" y="-30">LATTICE CORE</text>
    <text x="0" y="-16">2.3M sig/s</text>
    <text x="0" y="-4">847ms p99</text>
    <text x="0" y="8">99.97% up</text>
    <text x="0" y="20">1,247 deploy</text>
    <text x="0" y="32">12 industries</text>
    <text x="0" y="44">v1.0</text>
  </g>
</svg>